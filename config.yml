- name: armbian-orangepi5_max-bookworm
  type: armbian
  img_download_url: "https://github.com/theimmortal68/armbian-builds/releases/download/20250729-2112/armbian-orangepi5_max_bookworm.img.xz"
  img_hash_url: "https://github.com/theimmortal68/armbian-builds/releases/download/20250729-2112/armbian-orangepi5_max_bookworm.img.sha256"
  env:
    ARCH: arm64
    DISTRO: armbian
    IMAGE_ENLARGEROOT: 8000
    MOUNT_PROC: 1
    MOUNT_SYS: 1
  special_modules:
    - 50-kiauh
    - 70-node
    - 74-ratos
    - 82-klipper_linear_movement_analysis
    - 86-KlipperScreen
    - 90-opi_mcu
    - 94-hotspot
    - 98-dfu_util
    - 99-end_services
  rpi_json:
    name: "MainsailOS $VERSION$ - Orange Pi 5 Max (64-bit)"
    description: "A port of Armbian with preinstalled Klipper/Moonraker/Mainsail for 3D printers"
    icon: "https://os.mainsail.xyz/rpi-imager.png"
    devices:
      - "opi5max-64bit"

